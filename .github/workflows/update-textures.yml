name: Auto-Update Minecraft Textures

on:
  schedule:
    # Check for new Minecraft updates every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild and deployment even if version has not changed'
        type: boolean
        required: false
        default: false
      version:
        description: 'Specific Minecraft version to target (e.g. 26.3, or leave blank for latest release)'
        type: string
        required: false
        default: ''

# Permissions required to commit version bumps and deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.pipeline.outputs.updated }}
      version: ${{ steps.pipeline.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''

      - name: Cache Client JARs
        uses: actions/cache@v4
        with:
          path: .cache
          key: mc-cache-${{ runner.os }}-${{ hashFiles('version.json') }}
          restore-keys: |
            mc-cache-${{ runner.os }}-

      - name: Run Texture API Pipeline
        id: pipeline
        env:
          FORCE_ARG: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
          VER_ARG: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') && format('--version {0}', inputs.version) || '' }}
        run: |
          PAGES_BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "Pages Base URL: $PAGES_BASE_URL"

          python3 generate_textures.py \
            --base-url "$PAGES_BASE_URL" \
            $FORCE_ARG \
            $VER_ARG

      - name: Commit Updated Version Manifest
        if: steps.pipeline.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || (git commit -m "Auto-update textures to Minecraft ${{ steps.pipeline.outputs.version }}" && git push)

      - name: Upload GitHub Pages Artifact
        if: steps.pipeline.outputs.updated == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.updated == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force)
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
